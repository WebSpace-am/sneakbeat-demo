<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sneak Beat — Yerevan</title>
  <meta name="description" content="Sneak Beat — sneakers in the heart of Yerevan. Nike, adidas, New Balance, On, Vans and more. 4 Aram St, open daily 10:00–22:00. Delivery across Armenia.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="Sneak Beat — Yerevan">
  <meta property="og:description" content="In the heart of Yerevan, we move in beat.">
  <meta property="og:image" content="assets/store/storefront.jpg">
  <link rel="icon" href="assets/ig/logo-avatar.jpg">
  <link rel="apple-touch-icon" href="assets/ig/logo-avatar.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Noto+Sans+Armenian:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ShoeStore",
    "name": "Sneak Beat",
    "image": "assets/ig/logo-avatar.jpg",
    "telephone": "+37443300366",
    "address": { "@type": "PostalAddress", "streetAddress": "4 Aram St, 1st floor", "addressLocality": "Yerevan", "postalCode": "0001", "addressCountry": "AM" },
    "geo": { "@type": "GeoCoordinates", "latitude": 40.179191, "longitude": 44.514619 },
    "openingHours": "Mo-Su 10:00-22:00",
    "sameAs": ["https://www.instagram.com/sneakbeat.yvn/"]
  }
  </script>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>

  <!-- DEMO NOTICE: remove when the store approves and the site goes live with its own content -->
  <p class="demo-notice" role="note" data-i18n="demo.notice"></p>

  <header class="hdr">
    <div class="wrap hdr-in">
      <button class="icon-btn hdr-menu" type="button" data-open-menu data-i18n-label="nav.menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg>
      </button>

      <a class="logo" href="#/" aria-label="Sneak Beat — home">SNEAK BEAT</a>

      <nav aria-label="Main">
        <ul class="nav-main">
          <li><a href="#/shop" data-nav="shop" data-mega="shop" aria-haspopup="true" aria-expanded="false" data-i18n="nav.shop"></a></li>
          <li><a href="#/shop" data-nav="brands" data-mega="brands" aria-haspopup="true" aria-expanded="false" data-i18n="nav.brands"></a></li>
          <li><a href="#/store" data-nav="store" data-i18n="nav.store"></a></li>
        </ul>
      </nav>

      <a class="ck-help" href="tel:+37443300366"><span data-i18n="ck.help"></span> <strong>+374 43 300366</strong></a>

      <div class="hdr-actions">
        <div class="lang-pick">
          <button class="lang-btn" type="button" data-lang-toggle aria-haspopup="true" aria-expanded="false" aria-label="Language · Язык · Լեզու">
            <span data-lang-current>ENG</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
          </button>
          <div class="lang-menu" data-lang-menu hidden>
            <button type="button" data-lang="hy"><span>Հայերեն</span><b>ՀԱՅ</b></button>
            <button type="button" data-lang="ru"><span>Русский</span><b>РУС</b></button>
            <button type="button" data-lang="en"><span>English</span><b>ENG</b></button>
          </div>
        </div>
        <button class="icon-btn hdr-search-icon" type="button" data-open-search data-i18n-label="nav.search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        </button>
        <a class="icon-btn hdr-fav" href="#/favorites" data-i18n-label="nav.favorites">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.3s-7.5-4.6-9.2-9.4C1.6 7.4 3.8 4 7.3 4c2 0 3.5 1.1 4.7 2.7C13.2 5.1 14.7 4 16.7 4c3.5 0 5.7 3.4 4.5 6.9-1.7 4.8-9.2 9.4-9.2 9.4z"/></svg>
          <span class="dot" data-fav-count hidden></span>
        </a>
        <button class="icon-btn hdr-acct" type="button" data-open-auth data-i18n-label="nav.account">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5c.9-3.9 3.9-6 7.5-6s6.6 2.1 7.5 6"/></svg>
        </button>
        <button class="icon-btn hdr-bag" type="button" data-open-bag data-i18n-label="nav.bag">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12.5H6z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
          <span class="count" data-bag-count hidden></span>
        </button>
      </div>
    </div>

    <div class="mega" id="mega-shop" role="region" aria-label="Shop"></div>
    <div class="mega" id="mega-brands" role="region" aria-label="Brands"></div>
  </header>
  <div class="mega-scrim" aria-hidden="true"></div>

  <div class="promo" aria-live="off">
    <p class="promo-msg is-on" data-i18n="promo.1"></p>
    <p class="promo-msg" data-i18n="promo.2"></p>
    <p class="promo-msg" data-i18n="promo.3"></p>
  </div>

  <main id="app" tabindex="-1"></main>

  <footer class="ftr">
    <div class="wrap">
      <div class="ftr-cols">
        <div>
          <p class="ftr-h" data-i18n="footer.help"></p>
          <a href="#/help/delivery" data-i18n="footer.delivery"></a>
          <a href="#/help/returns" data-i18n="footer.returns"></a>
          <a href="#/help/payment" data-i18n="footer.payment"></a>
          <button type="button" data-size-guide data-i18n="footer.sizes"></button>
          <a href="#/help/contact" data-i18n="footer.contact"></a>
        </div>
        <div>
          <p class="ftr-h" data-i18n="footer.shop"></p>
          <a href="#/shop?sort=newest" data-i18n="nav.new"></a>
          <a href="#/shop?gender=men" data-i18n="nav.men"></a>
          <a href="#/shop?gender=women" data-i18n="nav.women"></a>
          <a href="#/shop" data-i18n="nav.shopAll"></a>
          <a href="#/favorites" data-i18n="nav.favorites"></a>
        </div>
        <div>
          <p class="ftr-h" data-i18n="footer.storeLink"></p>
          <a href="#/store" data-i18n="footer.addressLine"></a>
          <span data-i18n="footer.hoursLine"></span>
          <a href="tel:+37443300366">+374 43 300366</a>
          <a href="https://www.instagram.com/sneakbeat.yvn/" target="_blank" rel="noopener">Instagram</a>
          <a href="https://www.facebook.com/61576477738295" target="_blank" rel="noopener">Facebook</a>
        </div>
      </div>
      <p class="ftr-mark" aria-hidden="true">SNEAK BEAT</p>
      <div class="ftr-bottom">
        <span>© <span id="year"></span> Sneak Beat · Yerevan, Armenia</span>
        <a href="https://www.instagram.com/sneakbeat.yvn/" target="_blank" rel="noopener">@sneakbeat.yvn</a>
      </div>
    </div>
  </footer>

  <!-- ===== layers ===== -->
  <div class="layer layer--right" id="bag" hidden role="dialog" aria-modal="true" aria-labelledby="bag-title">
    <div class="layer-scrim" data-close></div>
    <div class="layer-panel bag">
      <div class="layer-head">
        <h2 class="h3" id="bag-title"><span data-i18n="bag.title"></span> <span class="bag-n" id="bag-count"></span></h2>
        <button class="icon-btn" type="button" data-close data-i18n-label="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="bag-body" id="bag-body"></div>
      <div class="bag-foot" id="bag-foot" hidden>
        <dl class="totals" id="bag-totals"></dl>
        <a class="btn btn--lg btn--block" href="#/checkout" data-i18n="bag.checkout"></a>
        <p class="fine" data-i18n="bag.returns"></p>
      </div>
    </div>
  </div>

  <div class="layer layer--top" id="search" hidden role="dialog" aria-modal="true" aria-label="Search">
    <div class="layer-scrim" data-close></div>
    <div class="layer-panel search">
      <div class="wrap">
        <form class="search-form" id="search-form" role="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input id="search-input" type="search" autocomplete="off" data-i18n-ph="search.placeholder" aria-label="Search" autofocus>
          <button class="link" type="button" data-close data-i18n="common.close"></button>
        </form>
        <div class="search-results" id="search-results"></div>
      </div>
    </div>
  </div>

  <div class="layer layer--modal" id="auth" hidden role="dialog" aria-modal="true" aria-labelledby="auth-title">
    <div class="layer-scrim" data-close></div>
    <div class="layer-panel auth">
      <button class="icon-btn layer-x" type="button" data-close data-i18n-label="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div id="auth-body"></div>
    </div>
  </div>

  <div class="layer layer--left" id="menu" hidden role="dialog" aria-modal="true" aria-label="Menu">
    <div class="layer-scrim" data-close></div>
    <div class="layer-panel menu">
      <div class="layer-head">
        <span class="logo">SNEAK BEAT</span>
        <button class="icon-btn" type="button" data-close data-i18n-label="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="menu-panels" id="menu-panels"></div>
    </div>
  </div>

  <div class="layer layer--modal" id="size-guide" hidden role="dialog" aria-modal="true" aria-label="Size guide">
    <div class="layer-scrim" data-close></div>
    <div class="layer-panel sg-panel">
      <button class="icon-btn layer-x" type="button" data-close data-i18n-label="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div id="sg-body"></div>
    </div>
  </div>

  <div class="layer layer--zoom" id="zoom" hidden role="dialog" aria-modal="true" aria-label="Image"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
